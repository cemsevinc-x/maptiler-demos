<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapTiler demos</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef1f6; color: #141821; min-height: 100vh;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 28px 80px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: -.025em; }
  .lead { margin: 0 0 32px; color: #6f7886; }
  a.card { display: block; text-decoration: none; color: inherit; background: #fff;
           border: 1px solid #e2e6ed; border-radius: 12px; padding: 18px 20px;
           margin-bottom: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  a.card:hover { border-color: #1a5fd0; box-shadow: 0 6px 20px -10px rgba(26,95,208,.45); }
  a.card h2 { margin: 0 0 3px; font-size: 16px; font-weight: 650; }

</style>
</head>
<body>
<div class="wrap">
  <h1>MapTiler demos</h1>
  <p class="lead">Small pages built while working through the SDK and its plugins.
     Each one is a single HTML file, no build step.</p>

  <a class="card" href="objects3d.html">
    <h2>3D objects</h2>
    <p>glTF meshes placed on the map by coordinate, with scale, heading, wireframe and animation.</p>
  </a>
